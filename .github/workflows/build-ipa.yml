name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Luma.ipa (macOS Runner)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Versiones de Xcode disponibles en el runner ==="
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          echo "=== Versión de Xcode activa ==="
          xcodebuild -version

      - name: Inspect Xcode Scheme and Targets
        run: |
          xcodebuild -list -project Luma.xcodeproj

      - name: Build Application (.app)
        run: |
          echo "Compilando Luma para arquitectura arm64 (iOS)..."
          xcodebuild clean build \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          echo "Creando estructura Payload para .ipa..."
          rm -rf build/Payload build/Luma.ipa
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Luma.app build/Payload/
          cd build
          zip -r Luma.ipa Payload
          ls -lh Luma.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-iOS-IPA
          path: build/Luma.ipa
          if-no-files-found: error
          retention-days: 14
